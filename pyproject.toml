[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "daisyrace8-indenthint"
version = "0.1.0"
description = "按结构键把条目聚类，标出提示词的层级缩进语义上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "daisyrace8" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://daisyrace8.github.io"
Repository = "https://github.com/daisyrace8/indenthint"
Issues = "https://github.com/daisyrace8/indenthint/issues"

[project.scripts]
indenthint = "indenthint:main"

[tool.setuptools]
py-modules = ["indenthint"]
